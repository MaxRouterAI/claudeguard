name: Desktop contracts and build
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Public file boundary
        run: |
          node --test scripts/export-public.test.mjs
          node scripts/export-public.mjs --check
      - name: Prepare pinned Rust
        run: rustup show
      - run: cargo fmt --all --check
      - name: Build frontend (no client or diagnostic traffic)
        working-directory: apps/desktop
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
          npm run format:check
      - name: Pure rules and fixture contracts only
        run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Compile bundled assets; never execute the application
        run: cargo build -p guard-desktop --features custom-protocol --locked

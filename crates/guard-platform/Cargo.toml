[package]
name = "guard-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
[dependencies]
guard-core = { path = "../guard-core" }
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSArray", "NSProcessInfo", "NSTimeZone", "NSNotification", "NSOperation", "NSDate", "NSError", "NSURL", "NSDictionary", "block2"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSRunningApplication", "NSGraphics", "NSWorkspace", "block2"] }
